name: Claude

# Claude reageert op @claude in issues, issuecomments en PR-reviewcomments.
# Voorbeeld in een issue: "@claude /factory:implement 12"
# Alleen gebruikers met schrijfrechten kunnen Claude starten.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: ${{ hashFiles('package.json') != '' }}
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: ${{ hashFiles('package.json') != '' }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/vuenta/software-factory.git"
          plugins: "factory@vuenta-factory"
          # Bash staat standaard uit; zonder deze regels kan Claude de tests niet draaien.
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(pnpm:*),Bash(git:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run list:*),Bash(gh run view:*)"
      # De push van @claude start zelf geen workflows. Heeft @claude voor dit issue een branch
      # gepusht, dan opent auto-pr.yml de PR en start CI en review.
      - name: PR openen voor de branch van @claude
        if: ${{ always() && github.event.issue && !github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NR: ${{ github.event.issue.number }}
        run: |
          BRANCH=$(gh api "repos/$GH_REPO/git/matching-refs/heads/claude/issue-$NR-" --jq '.[-1].ref // ""' | sed 's#^refs/heads/##')
          if [ -z "$BRANCH" ]; then
            echo "Geen branch van @claude voor #$NR."
            exit 0
          fi
          gh workflow run auto-pr.yml --ref main -f branch="$BRANCH"
